# Motox POS: KTM-verkoopprijs op ongepubliceerde OEM-producten.
#
# Zelfde prijs als ktm-shop.nl (CSV incl. btw, plus 9% op de markup-types).
# Alleen vendor KTM, Husqvarna, GasGas of WP, en alleen zonder Online Store
# publicatie. Gepubliceerde e-bihr-producten en voorraad blijven onaangeroerd.
#
# Secrets: KTM_* (FTP, zelfde als de prijsjob) en SHOPIFY_MOTOX_*.
#
# Schedule: elk uur :20 van 05:20 t/m 21:20 UTC.
# Zomer: 07:20–23:20 NL, twintig minuten na de KTM-prijsrun.
# Winter schuift dat een uur naar voren; een gemiste wijziging haalt de
# volgende run alsnog in, omdat elke run de hele OEM-set vergelijkt.

name: motox_oem_price_sync

on:
  schedule:
    - cron: "20 5-21 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = prijzen schrijven, false = alleen dry-run"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
      limit:
        description: "Max prijswijzigingen (0 = alle die afwijken)"
        required: false
        default: "0"
      dispatch_log_id:
        description: "Supabase workflow_dispatch_log.id (geplande dispatch)"
        required: false
        default: ""

jobs:
  motox_oem_price_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.apply == 'true') && 'shopify-write-lock' || 'motox-oem-price-dry' }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply || 'false' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
          KTM_SFTP_HOST: ${{ secrets.KTM_SFTP_HOST }}
          KTM_SFTP_USER: ${{ secrets.KTM_SFTP_USER }}
          KTM_SFTP_PASSWORD: ${{ secrets.KTM_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for k in SHOPIFY_MOTOX_ACCESS_TOKEN SHOPIFY_MOTOX_SHOP_DOMAIN KTM_SFTP_HOST KTM_SFTP_USER KTM_SFTP_PASSWORD; do
            if [[ -z "${!k}" ]]; then
              echo "::error::Secret $k ontbreekt"
              missing=1
            fi
          done
          exit $missing

      - name: Fetch prijsbestanden (FTP/SFTP/FTPS)
        env:
          KTM_TRANSFER_PROTOCOL: ${{ secrets.KTM_TRANSFER_PROTOCOL }}
          KTM_SFTP_HOST: ${{ secrets.KTM_SFTP_HOST }}
          KTM_SFTP_PORT: ${{ secrets.KTM_SFTP_PORT }}
          KTM_SFTP_USER: ${{ secrets.KTM_SFTP_USER }}
          KTM_SFTP_PASSWORD: ${{ secrets.KTM_SFTP_PASSWORD }}
          KTM_SFTP_REMOTE_DIR: ${{ secrets.KTM_SFTP_REMOTE_DIR }}
          KTM_SFTP_LOCAL_DIR: downloads/ftp
          KTM_SFTP_FILES: 1100_35_Z1_EUR_EN_csv.csv,0910_35_Z1_EUR_EN_csv.csv,0150_35_Z1_EUR_EN_csv.csv,0140_35_Z1_EUR_EN_csv.csv
          KTM_SFTP_PATTERN: ${{ secrets.KTM_SFTP_PATTERN }}
          KTM_FTP_TIMEOUT_SEC: ${{ secrets.KTM_FTP_TIMEOUT_SEC }}
          KTM_FTP_RETRIES: ${{ secrets.KTM_FTP_RETRIES }}
          KTM_FTP_RETRY_SLEEP_SEC: ${{ secrets.KTM_FTP_RETRY_SLEEP_SEC }}
          KTM_FTP_BLOCKSIZE: ${{ secrets.KTM_FTP_BLOCKSIZE }}
        run: python scripts/fetch_input_sftp.py

      - name: Verwijder oude prijs-CSV's uit input (stale guard)
        run: |
          rm -f input/0150_35_Z1_EUR_EN_csv.csv
          rm -f input/hsq/1100_35_Z1_EUR_EN_csv.csv
          rm -f input/hsq/0140_35_Z1_EUR_EN_csv.csv
          rm -f input/wp/0910_35_Z1_EUR_EN_csv.csv
          rm -f input/1100_35_Z1_EUR_EN_csv.csv
          rm -f input/0910_35_Z1_EUR_EN_csv.csv
          rm -f input/0140_35_Z1_EUR_EN_csv.csv

      - name: Staging → input/
        env:
          KTM_SFTP_LOCAL_DIR: downloads/ftp
          KTM_SFTP_FILES: 1100_35_Z1_EUR_EN_csv.csv,0910_35_Z1_EUR_EN_csv.csv,0150_35_Z1_EUR_EN_csv.csv,0140_35_Z1_EUR_EN_csv.csv
          KTM_PREPARE_FILES: 1100_35_Z1_EUR_EN_csv.csv,0910_35_Z1_EUR_EN_csv.csv,0150_35_Z1_EUR_EN_csv.csv,0140_35_Z1_EUR_EN_csv.csv
        run: python scripts/prepare_input_from_ftp.py

      - name: Valideer KTM 0150 aanwezig
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("input/0150_35_Z1_EUR_EN_csv.csv")
          if not p.is_file() or p.stat().st_size < 100:
              raise SystemExit("0150_35_Z1_EUR_EN_csv.csv ontbreekt of is leeg.")
          print(p, p.stat().st_size)
          PY

      - name: OEM-prijzen naar Motox
        env:
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
          SHOPIFY_MOTOX_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_MOTOX_ADMIN_API_VERSION }}
        run: |
          set -euo pipefail
          ARGS=(--sleep 0.15)
          if [[ "${APPLY}" == "true" ]]; then
            ARGS+=(--apply)
          fi
          if [[ "${LIMIT}" != "0" && -n "${LIMIT}" ]]; then
            ARGS+=(--limit "${LIMIT}")
          fi
          python3 -u scripts/motox_oem_price_sync.py "${ARGS[@]}"

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: motox-oem-price-sync-${{ github.run_id }}
          path: output/motox_oem_price_sync_*.csv
          if-no-files-found: ignore
          retention-days: 14
