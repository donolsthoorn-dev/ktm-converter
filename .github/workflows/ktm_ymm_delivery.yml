# Periodiek: controleer of er YMM bij te werken is, push diffs, backfill lege velden.
# Vereist: migratie 028 + canonical sync (na nieuwe XML / daily pipeline).
# Catalog mirror (producten/prijzen/ETA) blijft in ktm_job_worker.yml.
# Schedule schrijft en pakt shopify-write-lock-ktm. Een dry-run niet.

name: ktm_ymm_delivery

on:
  schedule:
    # Dagelijks 05:15 UTC — na primary new-products (04:00), vangt gemiste YMM op.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      handles:
        description: "Optioneel: komma-gescheiden handles (leeg = alle pending diffs)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run (geen Shopify writes / geen pushed_hash update)"
        type: boolean
        default: true
      limit:
        description: "Max producten per run (0 = geen limiet)"
        type: string
        default: "500"

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.dry_run == false) && 'shopify-write-lock-ktm' || 'ktm-ymm-delivery-dry' }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.28,<3"

      - name: Build job payload (handles path)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.handles != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          handles_raw = os.environ.get("HANDLES", "").strip()
          handles = [h.strip().lower() for h in handles_raw.split(",") if h.strip()] if handles_raw else []
          payload = {
              "dry_run": os.environ.get("DRY_RUN", "true").lower() == "true",
              "only_diff": True,
              "overwrite": True,
              "limit": int(os.environ.get("LIMIT", "500") or "500"),
          }
          if handles:
              payload["only_handles"] = handles
          with open("job_payload.json", "w") as f:
              json.dump(payload, f)
          print(json.dumps(payload, indent=2))
          PY
        env:
          HANDLES: ${{ inputs.handles }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}

      - name: Queue + worker (specific handles)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.handles != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
          SHOPIFY_PRODUCT_FITS_ON_NAMESPACE: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_NAMESPACE }}
          SHOPIFY_PRODUCT_FITS_ON_KEY: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_KEY }}
        run: |
          set -euo pipefail
          python scripts/queue_supabase_job.py shopify_ymm_push_diff_from_supabase \
            --trigger schedule --payload-json "$(cat job_payload.json)"
          failed=0
          for i in 1 2 3 4 5 6; do
            set +e
            out="$(python scripts/supabase_job_worker.py 2>&1)"
            ec=$?
            set -e
            echo "$out"
            if [ "$ec" -ne 0 ]; then failed=1; fi
            case "$out" in *"Geen queued jobs."*) break ;; esac
          done
          exit "$failed"

      - name: Report pending + push + backfill
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.handles == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
          SHOPIFY_PRODUCT_FITS_ON_NAMESPACE: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_NAMESPACE }}
          SHOPIFY_PRODUCT_FITS_ON_KEY: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          LIMIT: ${{ inputs.limit || '500' }}
        run: |
          set -euo pipefail
          LIMIT_ARG="${LIMIT:-500}"
          if [ "${DRY_RUN:-true}" = "true" ]; then
            echo "Dry-run: alleen pending-rapport."
            python scripts/ymm_ensure_updatable.py --report-only --limit "$LIMIT_ARG"
          else
            python scripts/ymm_ensure_updatable.py --write --push --backfill --limit "$LIMIT_ARG"
          fi
