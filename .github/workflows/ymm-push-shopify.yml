# Supabase canonical YMM → Shopify metafields (handmatige trigger).
# Na lokale --sync-only: full_push=true, run_xml_sync=false, handles leeg = hele catalogus.
# Secrets: SUPABASE_*, SHOPIFY_* (zelfde als job-worker.yml)

name: YMM push to Shopify

on:
  workflow_dispatch:
    inputs:
      handles:
        description: "Handles (komma-gescheiden); leeg = alle producten met YMM in canonical"
        required: false
        default: ""
      dry_run:
        description: "Dry-run (geen Supabase/Shopify writes)"
        type: boolean
        default: true
      full_push:
        description: "Volledige push (only_diff=false), niet alleen content_hash-wijzigingen"
        type: boolean
        default: false
      run_xml_sync:
        description: "Stap 1 XML→Supabase (vereist CBEXPDN in input/ op runner)"
        type: boolean
        default: false
      skip_shopify_push:
        description: "Alleen Supabase sync + projection, geen Shopify API"
        type: boolean
        default: false
      limit:
        description: "Max producten (0 = geen limiet; handig voor test)"
        type: string
        default: "0"

jobs:
  ymm_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.28,<3" lxml

      - name: Build payload JSON
        id: payload
        run: |
          python3 - <<'PY'
          import json, os
          handles = [h.strip().lower() for h in os.environ.get("HANDLES", "").split(",") if h.strip()]
          payload = {
              "dry_run": os.environ.get("DRY", "true").lower() == "true",
              "overwrite": True,
              "only_diff": os.environ.get("FULL_PUSH", "false").lower() != "true",
              "limit": int(os.environ.get("LIMIT", "0") or "0"),
          }
          if handles:
              payload["only_handles"] = handles
          with open("job_payload.json", "w") as f:
              json.dump(payload, f)
          print(json.dumps(payload, indent=2))
          PY
        env:
          DRY: ${{ inputs.dry_run }}
          HANDLES: ${{ inputs.handles }}
          FULL_PUSH: ${{ inputs.full_push }}
          LIMIT: ${{ inputs.limit }}

      - name: Queue canonical_ymm_sync_to_supabase
        if: inputs.run_xml_sync == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PAYLOAD=$(cat job_payload.json)
          python scripts/queue_supabase_job.py canonical_ymm_sync_to_supabase \
            --trigger manual --payload-json "$PAYLOAD"

      - name: Queue shopify_ymm_projection_refresh
        if: inputs.run_xml_sync == true || (inputs.skip_shopify_push == false && inputs.run_xml_sync == false)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/queue_supabase_job.py shopify_ymm_projection_refresh --trigger manual

      - name: Queue shopify_ymm_push (full catalog)
        if: inputs.skip_shopify_push == false && inputs.full_push == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PAYLOAD=$(cat job_payload.json)
          python scripts/queue_supabase_job.py shopify_ymm_push_from_supabase \
            --trigger manual --payload-json "$PAYLOAD"

      - name: Queue shopify_ymm_push_diff_from_supabase
        if: inputs.skip_shopify_push == false && inputs.full_push == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PAYLOAD=$(cat job_payload.json)
          python scripts/queue_supabase_job.py shopify_ymm_push_diff_from_supabase \
            --trigger manual --payload-json "$PAYLOAD"

      - name: Process queued jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
          SHOPIFY_PRODUCT_FITS_ON_NAMESPACE: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_NAMESPACE }}
          SHOPIFY_PRODUCT_FITS_ON_KEY: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_KEY }}
        run: |
          failed=0
          for i in $(seq 1 24); do
            set +e
            out="$(python scripts/supabase_job_worker.py 2>&1)"
            ec=$?
            set -e
            echo "$out"
            if [ "$ec" -ne 0 ]; then
              echo "Worker exit $ec" >&2
              failed=1
            fi
            case "$out" in
              *"Geen queued jobs."*) break ;;
            esac
          done
          exit "$failed"
