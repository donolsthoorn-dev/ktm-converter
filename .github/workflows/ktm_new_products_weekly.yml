# Wekelijkse nieuwe producten: PIM (XML+PHO) op VPS → rebuild → API-import → YMM → complementary.
# Draait via SSH op motoxshop-vps2 (zelfde patroon als motox_putoline), zodat grote input/
# op de VPS-schijf blijft. Prijs/ETA blijft in ktm_price_eta_status_sync (nachtelijk).
#
# Secrets: MOTOX_VPS_SSH_KEY (privésleutel voor motoxshop@149.210.206.111).
# Op de VPS: /home/motoxshop/ktm_project met .env (FTP, Shopify, Supabase).

name: ktm_new_products_weekly

on:
  schedule:
    # Maandag 03:30 UTC ≈ 05:30 NL zomer / 04:30 winter — na Putoline 02:15 NL
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      brands:
        description: "Merken (komma): ktm,hsq,wp"
        required: false
        default: "ktm,hsq,wp"
      skip_pim:
        description: "PIM-refresh overslaan (alleen rebuild/import/YMM)"
        type: boolean
        default: false
      dry_run_import:
        description: "Import alleen dry-run (geen productCreate)"
        type: boolean
        default: false
      import_limit:
        description: "Max nieuwe producten (0=alle)"
        required: false
        default: "0"

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: shopify-write-lock-ktm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline on VPS
        env:
          SSH_KEY: ${{ secrets.MOTOX_VPS_SSH_KEY }}
          BRANDS: ${{ github.event.inputs.brands || 'ktm,hsq,wp' }}
          SKIP_PIM: ${{ github.event.inputs.skip_pim || 'false' }}
          DRY_IMPORT: ${{ github.event.inputs.dry_run_import || 'false' }}
          IMPORT_LIMIT: ${{ github.event.inputs.import_limit || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret MOTOX_VPS_SSH_KEY ontbreekt of is leeg (zelfde secret als motox_putoline)."
            exit 1
          fi
          echo "SSH_KEY length=${#SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/ktm_vps
          chmod 600 ~/.ssh/ktm_vps
          if ! ssh-keygen -y -f ~/.ssh/ktm_vps >/dev/null 2>&1; then
            echo "::error::MOTOX_VPS_SSH_KEY is geen geldige private key."
            exit 1
          fi

          # Keepalives + korte poll-SSH: lange stille FTP anders → Broken pipe
          SSH_OPTS=(
            -i "$HOME/.ssh/ktm_vps"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=120
          )
          HOST="motoxshop@149.210.206.111"
          REMOTE="/home/motoxshop/ktm_project"

          echo "SSH connectivity check…"
          if ! ssh "${SSH_OPTS[@]}" "$HOST" 'echo ok; hostname; test -d /home/motoxshop/ktm_project'; then
            echo "::error::SSH geweigerd. Zet secret via: gh secret set MOTOX_VPS_SSH_KEY --repo donolsthoorn-dev/ktm-converter < ~/.ssh/id_ed25519"
            exit 255
          fi

          FLAGS="--brands ${BRANDS}"
          if [ "$SKIP_PIM" = "true" ]; then
            FLAGS="$FLAGS --skip-pim"
          fi
          if [ "$DRY_IMPORT" = "true" ]; then
            FLAGS="$FLAGS --dry-run-import"
          fi
          if [ -n "$IMPORT_LIMIT" ] && [ "$IMPORT_LIMIT" != "0" ]; then
            FLAGS="$FLAGS --import-limit $IMPORT_LIMIT"
          fi
          echo "FLAGS=$FLAGS"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'input/' \
            --exclude 'downloads/' \
            --exclude 'output/' \
            --exclude 'cache/' \
            --exclude '.venv/' \
            --exclude 'ktm/theme/' \
            --exclude 'motox/theme/' \
            --exclude '__pycache__/' \
            -e "ssh ${SSH_OPTS[*]}" \
            ./ "$HOST:$REMOTE/"

          # Detach: pipeline blijft draaien als GHA-SSH wegvalt; we poll'en het log.
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID:-local}"
          LOG="$REMOTE/output/logs/weekly_${RUN_ID}.log"
          EXITF="$REMOTE/output/logs/weekly_${RUN_ID}.exit"
          PIDF="$REMOTE/output/logs/weekly_${RUN_ID}.pid"
          echo "Remote log: $LOG"

          ssh "${SSH_OPTS[@]}" "$HOST" bash -s <<EOF
          set -e
          mkdir -p "$REMOTE/output/logs"
          cd "$REMOTE"
          rm -f "$EXITF"
          nohup bash -c '
            set +e
            if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=python3; fi
            \$PY -u scripts/run_new_products_weekly.py $FLAGS
            echo \$? > "$EXITF"
          ' > "$LOG" 2>&1 < /dev/null &
          echo \$! > "$PIDF"
          echo "started pid=\$(cat "$PIDF")"
          EOF

          OFFSET=0
          while true; do
            META="$(mktemp)"
            # Short SSH: dump new log bytes + status (survives NAT better than one long session)
            ssh "${SSH_OPTS[@]}" "$HOST" \
              "python3 -c \"
          import sys
          from pathlib import Path
          log, ex, off = Path('$LOG'), Path('$EXITF'), $OFFSET
          data = log.read_bytes() if log.is_file() else b''
          sys.stdout.buffer.write(data[off:])
          sys.stdout.buffer.flush()
          print(f'OFFSET {len(data)}', file=sys.stderr)
          print(f'DONE {int(ex.is_file())}', file=sys.stderr)
          if ex.is_file():
              print(f'RC {ex.read_text().strip()}', file=sys.stderr)
          \"" 2>"$META" || true

            OFFSET="$(awk '/^OFFSET /{print \$2}' "$META" | tail -1)"
            OFFSET="${OFFSET:-0}"
            DONE="$(awk '/^DONE /{print \$2}' "$META" | tail -1)"
            if [ "${DONE:-0}" = "1" ]; then
              RC="$(awk '/^RC /{print \$2}' "$META" | tail -1)"
              rm -f "$META"
              echo ""
              echo "Remote finished with exit=${RC:-1}"
              exit "${RC:-1}"
            fi
            rm -f "$META"
            echo "[poll] log_bytes=$OFFSET" >&2
            sleep 20
          done
