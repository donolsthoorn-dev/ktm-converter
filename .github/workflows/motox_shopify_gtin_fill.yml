# Motox: vul lege barcodes vanuit e-bihr BarCode (EAN/GTIN).
#
# Alleen fill-if-empty. Bestaande barcodes blijven staan.
# Haalt alleen het Bihr Products-catalogusbestand op, niet prijzen of VSE.
#
# Secrets:
#   BIHR_USERNAME, BIHR_PASSWORD
#   SHOPIFY_MOTOX_ACCESS_TOKEN, SHOPIFY_MOTOX_SHOP_DOMAIN
#   optioneel SHOPIFY_MOTOX_ADMIN_API_VERSION, BIHR_API_BASE
#
# Schedule: 05:15 UTC. Deelt shopify-write-lock, dus wacht tot e-bihr-sync
# en de dubbelen-job klaar zijn. Zo raken twee Bihr-downloads elkaar niet.

name: motox_shopify_gtin_fill

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = schrijven, false = alleen dry-run"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
      limit:
        description: "Max te vullen varianten (0 = alle)"
        required: false
        default: "0"
      dispatch_log_id:
        description: "Supabase workflow_dispatch_log.id (geplande dispatch)"
        required: false
        default: ""

jobs:
  motox_shopify_gtin_fill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.apply == 'true') && 'shopify-write-lock' || 'motox-gtin-fill-dry' }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply || 'false' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          BIHR_USERNAME: ${{ secrets.BIHR_USERNAME }}
          BIHR_PASSWORD: ${{ secrets.BIHR_PASSWORD }}
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
        run: |
          set -euo pipefail
          missing=0
          for k in BIHR_USERNAME BIHR_PASSWORD SHOPIFY_MOTOX_ACCESS_TOKEN SHOPIFY_MOTOX_SHOP_DOMAIN; do
            if [[ -z "${!k}" ]]; then
              echo "::error::Secret $k ontbreekt"
              missing=1
            fi
          done
          exit $missing

      - name: GTIN fill-if-empty
        env:
          BIHR_USERNAME: ${{ secrets.BIHR_USERNAME }}
          BIHR_PASSWORD: ${{ secrets.BIHR_PASSWORD }}
          BIHR_API_BASE: ${{ secrets.BIHR_API_BASE }}
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
          SHOPIFY_MOTOX_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_MOTOX_ADMIN_API_VERSION }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --sleep 0.15)
          if [[ "${APPLY}" == "true" ]]; then
            ARGS+=(--apply)
          fi
          if [[ "${LIMIT}" != "0" && -n "${LIMIT}" ]]; then
            ARGS+=(--limit "${LIMIT}")
          fi
          python3 -u scripts/motox_shopify_gtin_fill.py "${ARGS[@]}"

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: motox-shopify-gtin-fill-${{ github.run_id }}
          path: output/motox_shopify_gtin_fill_*.csv
          if-no-files-found: ignore
          retention-days: 14
