# Nachtelijk: Shopify-catalogus → Supabase + YMM-projectie verversen.
#
# Geen volledige YMM-backfill naar Shopify in deze run (te zwaar; zie docs/supabase-ymm-pipeline.md).
# Handmatig backfill: queue_supabase_job.py shopify_ymm_backfill_from_supabase met limit > 0.
#
# Trigger: schedule (UTC) of workflow_dispatch. Prijs/ETA: price_eta_status_sync.yml
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SHOPIFY_ACCESS_TOKEN, SHOPIFY_SHOP_DOMAIN
# Optioneel: SHOPIFY_ADMIN_API_VERSION, SHOPIFY_VARIANT_ETA_*, SHOPIFY_PRODUCT_FITS_ON_*

name: Job worker

on:
  schedule:
    # GitHub cron uses UTC. 00:00 UTC ~= 02:00 NL in summer time (CEST).
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.28,<3"

      - name: Queue nightly jobs (mirror + YMM projection)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/queue_supabase_job.py shopify_catalog_mirror --trigger schedule
          python scripts/queue_supabase_job.py shopify_ymm_projection_refresh --trigger schedule

      - name: Process queued jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
          SHOPIFY_VARIANT_ETA_METAFIELD_NAMESPACE: ${{ secrets.SHOPIFY_VARIANT_ETA_METAFIELD_NAMESPACE }}
          SHOPIFY_VARIANT_ETA_METAFIELD_KEY: ${{ secrets.SHOPIFY_VARIANT_ETA_METAFIELD_KEY }}
          SHOPIFY_PRODUCT_FITS_ON_NAMESPACE: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_NAMESPACE }}
          SHOPIFY_PRODUCT_FITS_ON_KEY: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_KEY }}
        run: |
          set -e
          for i in 1 2 3 4; do
            out="$(python scripts/supabase_job_worker.py)"
            echo "$out"
            case "$out" in
              *"Geen queued jobs."*) break ;;
            esac
          done
