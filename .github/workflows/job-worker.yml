# Nightly: Shopify catalog -> Supabase (+ optional YMM projection after migration 020).
# See docs/supabase-ymm-pipeline.md

name: Job worker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      refresh_projection:
        description: Also queue shopify_ymm_projection_refresh (needs migration 020 on Supabase)
        type: boolean
        default: false
      dispatch_log_id:
        description: "Supabase workflow_dispatch_log.id (geplande dispatch)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.28,<3"

      - name: Queue shopify_catalog_mirror
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/queue_supabase_job.py shopify_catalog_mirror --trigger schedule

      - name: Queue shopify_ymm_projection_refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_projection == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/queue_supabase_job.py shopify_ymm_projection_refresh --trigger schedule

      - name: Process queued jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
          SHOPIFY_VARIANT_ETA_METAFIELD_NAMESPACE: ${{ secrets.SHOPIFY_VARIANT_ETA_METAFIELD_NAMESPACE }}
          SHOPIFY_VARIANT_ETA_METAFIELD_KEY: ${{ secrets.SHOPIFY_VARIANT_ETA_METAFIELD_KEY }}
          SHOPIFY_PRODUCT_FITS_ON_NAMESPACE: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_NAMESPACE }}
          SHOPIFY_PRODUCT_FITS_ON_KEY: ${{ secrets.SHOPIFY_PRODUCT_FITS_ON_KEY }}
        run: |
          failed=0
          for i in 1 2 3 4 5 6; do
            set +e
            out="$(python scripts/supabase_job_worker.py 2>&1)"
            ec=$?
            set -e
            echo "$out"
            if [ "$ec" -ne 0 ]; then
              echo "Worker exit $ec (job failed or HTTP error)" >&2
              failed=1
            fi
            case "$out" in
              *"Geen queued jobs."*) break ;;
            esac
          done
          exit "$failed"
