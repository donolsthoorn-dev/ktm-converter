# Dagelijkse nieuwe producten: PIM (XML+PHO) op VPS → rebuild → API-import → YMM → complementary.
# FTP-fingerprint: ongewijzigde PIM-zips → noop in seconden (geen Shopify-writes).
# Na echte PIM-refresh altijd YMM/complementary (ook bij 0 nieuwe producten).
# Volle run deelt concurrency shopify-write-lock-ktm (wacht/queued, cancelt anderen niet).
#
# Secrets: MOTOX_VPS_SSH_KEY (privésleutel voor motoxshop@149.210.206.111).
# Op de VPS: /home/motoxshop/ktm_project met .env (FTP, Shopify, Supabase).

name: ktm_new_products_daily

on:
  schedule:
    # Dagelijks 04:00 UTC ≈ 06:00 NL zomer / 05:00 winter.
    # Na typische PIM-drop (~03:15 UTC), na Putoline (02:15 NL), vóór YMM-delivery ma 05:15 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      brands:
        description: "Merken (komma): ktm,hsq,wp"
        required: false
        default: "ktm,hsq,wp"
      skip_pim:
        description: "PIM-refresh overslaan (FTP/XML/PHO/prijs-CSV)"
        type: boolean
        default: false
      skip_rebuild:
        description: "Delta-rebuild overslaan (hergebruik bestaande shopify_export_delta_*.csv op VPS)"
        type: boolean
        default: false
      force_pim:
        description: "FTP-fingerprint negeren (altijd PIM ophalen)"
        type: boolean
        default: false
      dry_run_import:
        description: "Import alleen dry-run (geen productCreate)"
        type: boolean
        default: false
      import_limit:
        description: "Max nieuwe producten (0=alle)"
        required: false
        default: "0"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: shopify-write-lock-ktm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline on VPS
        env:
          SSH_KEY: ${{ secrets.MOTOX_VPS_SSH_KEY }}
          BRANDS: ${{ github.event.inputs.brands || 'ktm,hsq,wp' }}
          SKIP_PIM: ${{ github.event.inputs.skip_pim || 'false' }}
          SKIP_REBUILD: ${{ github.event.inputs.skip_rebuild || 'false' }}
          FORCE_PIM: ${{ github.event.inputs.force_pim || 'false' }}
          DRY_IMPORT: ${{ github.event.inputs.dry_run_import || 'false' }}
          IMPORT_LIMIT: ${{ github.event.inputs.import_limit || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret MOTOX_VPS_SSH_KEY ontbreekt of is leeg (zelfde secret als motox_putoline)."
            exit 1
          fi
          echo "SSH_KEY length=${#SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/ktm_vps
          chmod 600 ~/.ssh/ktm_vps
          if ! ssh-keygen -y -f ~/.ssh/ktm_vps >/dev/null 2>&1; then
            echo "::error::MOTOX_VPS_SSH_KEY is geen geldige private key."
            exit 1
          fi

          SSH_OPTS=(
            -i "$HOME/.ssh/ktm_vps"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=120
          )
          HOST="motoxshop@149.210.206.111"
          REMOTE="/home/motoxshop/ktm_project"

          echo "SSH connectivity check…"
          if ! ssh "${SSH_OPTS[@]}" "$HOST" 'echo ok; hostname; test -d /home/motoxshop/ktm_project'; then
            echo "::error::SSH geweigerd. Zet secret via: gh secret set MOTOX_VPS_SSH_KEY --repo donolsthoorn-dev/ktm-converter < ~/.ssh/id_ed25519"
            exit 255
          fi

          FLAGS="--brands ${BRANDS}"
          if [ "$SKIP_PIM" = "true" ]; then
            FLAGS="$FLAGS --skip-pim"
          fi
          if [ "$SKIP_REBUILD" = "true" ]; then
            FLAGS="$FLAGS --skip-rebuild"
          fi
          if [ "$FORCE_PIM" = "true" ]; then
            FLAGS="$FLAGS --force-pim"
          fi
          if [ "$DRY_IMPORT" = "true" ]; then
            FLAGS="$FLAGS --dry-run-import"
          fi
          if [ -n "$IMPORT_LIMIT" ] && [ "$IMPORT_LIMIT" != "0" ]; then
            FLAGS="$FLAGS --import-limit $IMPORT_LIMIT"
          fi
          echo "FLAGS=$FLAGS"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'input/' \
            --exclude 'downloads/' \
            --exclude 'output/' \
            --exclude 'cache/' \
            --exclude '.venv/' \
            --exclude 'ktm/theme/' \
            --exclude 'motox/theme/' \
            --exclude '__pycache__/' \
            -e "ssh ${SSH_OPTS[*]}" \
            ./ "$HOST:$REMOTE/"

          # Detach: lange stille FTP mag GHA-SSH niet killen; poll korte sessies.
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID:-local}"
          LOG="$REMOTE/output/logs/daily_${RUN_ID}.log"
          EXITF="$REMOTE/output/logs/daily_${RUN_ID}.exit"
          PIDF="$REMOTE/output/logs/daily_${RUN_ID}.pid"
          echo "Remote log: $LOG"

          ssh "${SSH_OPTS[@]}" "$HOST" \
            "mkdir -p '$REMOTE/output/logs' && cd '$REMOTE' && rm -f '$EXITF' && \
             nohup env bash -c 'set +e; PY=.venv/bin/python; [ -x \"\$PY\" ] || PY=python3; \
               \$PY -u scripts/run_new_products_daily.py $FLAGS; echo \$? > \"$EXITF\"' \
               > '$LOG' 2>&1 < /dev/null & echo \$! > '$PIDF' && echo started pid=\$(cat '$PIDF')"

          OFFSET=0
          while true; do
            # Statusregel: DONE|RC|BYTES
            STATUS="$(ssh "${SSH_OPTS[@]}" "$HOST" \
              "python3 -c \"from pathlib import Path; log,ex=Path('$LOG'),Path('$EXITF'); n=log.stat().st_size if log.is_file() else 0; d=1 if ex.is_file() else 0; r=(ex.read_text().strip() if d else ''); print(f'{d}|{r}|{n}')\"" \
              | tail -1)" || STATUS="0||${OFFSET}"

            DONE="${STATUS%%|*}"
            REST="${STATUS#*|}"
            RC="${REST%%|*}"
            BYTES="${REST##*|}"
            DONE="${DONE:-0}"
            BYTES="${BYTES:-0}"

            if [ "$BYTES" -gt "$OFFSET" ] 2>/dev/null; then
              ssh "${SSH_OPTS[@]}" "$HOST" \
                "dd if='$LOG' bs=1 skip=$OFFSET count=$((BYTES - OFFSET)) 2>/dev/null" || true
              OFFSET="$BYTES"
            fi

            if [ "$DONE" = "1" ]; then
              echo ""
              echo "Remote finished with exit=${RC:-1}"
              exit "${RC:-1}"
            fi

            echo "[poll] log_bytes=$OFFSET" >&2
            sleep 20
          done
