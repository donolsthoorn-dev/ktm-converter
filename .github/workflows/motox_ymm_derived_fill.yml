# Motox: vul ymm_summary en fits_on_make/model/year vanuit global.fits_on.
#
# Loopt de catalogus na. Schrijft alleen waar de afgeleide velden ontbreken
# of niet meer kloppen bij de huidige fits_on. Producten zonder fits_on
# blijven ongemoeid.
#
# Secrets:
#   SHOPIFY_MOTOX_ACCESS_TOKEN, SHOPIFY_MOTOX_SHOP_DOMAIN
#   optioneel SHOPIFY_MOTOX_ADMIN_API_VERSION
#
# Schedule: 02:30 UTC ≈ 04:30 NL (zomer) / 03:30 (winter), na de e-Bihr-sync.
# Deelt shopify-write-lock-motox, dus wacht tot een lopende Motox-schrijfjob klaar is.

name: motox_ymm_derived_fill

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = schrijven, false = alleen dry-run"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
      limit:
        description: "Max te schrijven producten (0 = alle)"
        required: false
        default: "0"
      handle:
        description: "Alleen deze handle (leeg = hele catalogus)"
        required: false
        default: ""

jobs:
  motox_ymm_derived_fill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.apply == 'true') && 'shopify-write-lock-motox' || 'motox-ymm-derived-dry' }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply || 'false' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      HANDLE: ${{ github.event.inputs.handle || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
        run: |
          set -euo pipefail
          missing=0
          for k in SHOPIFY_MOTOX_ACCESS_TOKEN SHOPIFY_MOTOX_SHOP_DOMAIN; do
            if [[ -z "${!k}" ]]; then
              echo "::error::Secret $k ontbreekt"
              missing=1
            fi
          done
          exit $missing

      - name: YMM afgeleide velden
        env:
          SHOPIFY_MOTOX_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MOTOX_ACCESS_TOKEN }}
          SHOPIFY_MOTOX_SHOP_DOMAIN: ${{ secrets.SHOPIFY_MOTOX_SHOP_DOMAIN }}
          SHOPIFY_MOTOX_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_MOTOX_ADMIN_API_VERSION }}
        run: |
          set -euo pipefail
          ARGS=(--sleep 0.2)
          if [[ "${APPLY}" == "true" ]]; then
            ARGS+=(--apply)
          fi
          if [[ "${LIMIT}" != "0" && -n "${LIMIT}" ]]; then
            ARGS+=(--limit "${LIMIT}")
          fi
          if [[ -n "${HANDLE}" ]]; then
            ARGS+=(--handle "${HANDLE}")
          fi
          python3 -u scripts/motox_ymm_derived_fill.py "${ARGS[@]}"

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: motox-ymm-derived-fill-${{ github.run_id }}
          path: output/motox_ymm_derived_fill_*.csv
          if-no-files-found: ignore
          retention-days: 14
