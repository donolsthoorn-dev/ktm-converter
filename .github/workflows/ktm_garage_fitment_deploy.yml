# KTM garage: catalogus + fitment.bin vernieuwen en naar Vercel deployen.
#
# Bron: Supabase canonical_product_fits_on (na YMM-push blijft die bron van waarheid).
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VERCEL_TOKEN
#
# Schedule: 04:45 UTC ≈ 06:45 NL (zomer) / 05:45 (winter), na de YMM-push-nacht.
# Handmatig: workflow_dispatch.

name: ktm_garage_fitment_deploy

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install "requests>=2.28,<3"

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN; do
            if [[ -z "${!k}" ]]; then
              echo "::error::Secret $k ontbreekt"
              missing=1
            fi
          done
          exit $missing

      - name: Build + deploy ktm-garage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/deploy_ktm_garage_vercel.py
