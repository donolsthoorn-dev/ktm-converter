[access_scopes]
scopes = "read_customers,write_customers,read_products"

[auth]
redirect_urls = [ "https://motox-garage.vercel.app/api/auth" ]

[app_proxy]
url = "https://motox-garage.vercel.app/proxy"
prefix = "apps"
subpath = "garage"
